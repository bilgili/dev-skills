<svg viewBox="0 0 1000 1155" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111827"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1155" fill="#ffffff"/>
  <text x="500" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">spec-driven-tla — sub-agent pipeline</text>

  <g transform="translate(0,35)">
  <!-- main flow arrows -->
  <path d="M430,68 L430,100" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,170 L430,250" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,320 L430,400" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,470 L430,550" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,620 L430,700" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,770 L430,802" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,858 L430,900" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="450" y="365" font-size="11" fill="#111827">APPROVE — interfaces FROZEN</text>
  <text x="450" y="795" font-size="11" fill="#111827">green</text>

  <!-- design-gate <-> tla-checker -->
  <path d="M560,270 L650,270" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="565" y="263" font-size="10" fill="#111827">props to check</text>
  <path d="M650,300 L560,300" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="565" y="315" font-size="10" fill="#111827">PASS</text>

  <!-- implementer -> escalate -->
  <path d="M560,585 L650,585" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="562" y="578" font-size="10" fill="#111827">interface friction</text>

  <!-- feedback loop: tla-checker FAIL -> spec-author -->
  <path d="M760,250 L760,150 L560,150" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="610" y="142" font-size="10" fill="#b91c1c">FAIL: counterexample</text>

  <!-- feedback loop: design-gate REJECT -> spec-author -->
  <path d="M300,285 L190,285 L190,125 L300,125" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="185" y="205" text-anchor="end" font-size="10" fill="#b91c1c">REJECT: named property</text>

  <!-- feedback loop: verifier red -> implementer -->
  <path d="M300,735 L250,735 L250,585 L300,585" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="245" y="665" text-anchor="end" font-size="10" fill="#b91c1c">red</text>

  <!-- advisory loop: optimizer SAFE -> implementer -->
  <path d="M300,935 L130,935 L130,605 L300,605" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-dasharray="2,3" marker-end="url(#arrowBlue)"/>
  <text x="125" y="760" text-anchor="end" font-size="10" fill="#1d4ed8">SAFE: internals only</text>

  <!-- advisory loop: optimizer INTERFACE -> spec-author -->
  <path d="M300,955 L70,955 L70,150 L300,150" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-dasharray="2,3" marker-end="url(#arrowBlue)"/>
  <text x="65" y="552" text-anchor="end" font-size="10" fill="#1d4ed8">INTERFACE: new contract</text>

  <!-- Request -->
  <ellipse cx="430" cy="40" rx="110" ry="28" fill="#334155"/>
  <text x="430" y="45" text-anchor="middle" font-size="13" fill="#ffffff">feature request</text>

  <!-- spec-author -->
  <rect x="300" y="100" width="260" height="70" rx="8" fill="#065f46"/>
  <text x="430" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">spec-author</text>
  <text x="430" y="142" text-anchor="middle" font-size="11" fill="#d1fae5">proposal.md, design.md</text>
  <text x="430" y="156" text-anchor="middle" font-size="10" fill="#a7f3d0">specs/tla/&lt;id&gt;.tla</text>

  <!-- design-gate -->
  <rect x="300" y="250" width="260" height="70" rx="8" fill="#3730a3"/>
  <text x="430" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">design-gate</text>
  <text x="430" y="292" text-anchor="middle" font-size="11" fill="#e0e7ff">validate --strict, review</text>
  <text x="430" y="306" text-anchor="middle" font-size="10" fill="#c7d2fe">owns specs/tla/&lt;id&gt;.cfg</text>

  <!-- tla-checker -->
  <rect x="650" y="250" width="220" height="70" rx="8" fill="#7c2d12"/>
  <text x="760" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">tla-checker</text>
  <text x="760" y="292" text-anchor="middle" font-size="11" fill="#fed7aa">SANY + TLC</text>
  <text x="760" y="306" text-anchor="middle" font-size="10" fill="#fdba74">PASS / FAIL + trace</text>

  <!-- task-planner -->
  <rect x="300" y="400" width="260" height="70" rx="8" fill="#065f46"/>
  <text x="430" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">task-planner</text>
  <text x="430" y="442" text-anchor="middle" font-size="11" fill="#d1fae5">tasks.md</text>
  <text x="430" y="456" text-anchor="middle" font-size="10" fill="#a7f3d0">every task traces to spec</text>

  <!-- implementer -->
  <rect x="300" y="550" width="260" height="70" rx="8" fill="#065f46"/>
  <text x="430" y="576" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">implementer</text>
  <text x="430" y="592" text-anchor="middle" font-size="11" fill="#d1fae5">code to frozen contracts</text>
  <text x="430" y="606" text-anchor="middle" font-size="10" fill="#a7f3d0">never edits design.md / .tla</text>

  <!-- escalate -->
  <ellipse cx="760" cy="585" rx="110" ry="35" fill="#334155"/>
  <text x="760" y="580" text-anchor="middle" font-size="12" fill="#ffffff">stop + escalate</text>
  <text x="760" y="595" text-anchor="middle" font-size="10" fill="#cbd5e1">new OpenSpec change</text>

  <!-- verifier -->
  <rect x="300" y="700" width="260" height="70" rx="8" fill="#065f46"/>
  <text x="430" y="726" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">verifier</text>
  <text x="430" y="742" text-anchor="middle" font-size="11" fill="#d1fae5">tests from spec scenarios</text>
  <text x="430" y="756" text-anchor="middle" font-size="10" fill="#a7f3d0">green = matches spec</text>

  <!-- archive -->
  <ellipse cx="430" cy="830" rx="100" ry="28" fill="#334155"/>
  <text x="430" y="835" text-anchor="middle" font-size="13" fill="#ffffff">openspec archive</text>

  <!-- optimizer -->
  <rect x="300" y="900" width="260" height="70" rx="8" fill="#7c2d12"/>
  <text x="430" y="926" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">optimizer</text>
  <text x="430" y="942" text-anchor="middle" font-size="11" fill="#fed7aa">advisory, post-archive</text>
  <text x="430" y="956" text-anchor="middle" font-size="10" fill="#fdba74">read-only everywhere</text>

  <!-- legend -->
  <g transform="translate(60,1000)">
    <rect x="0" y="0" width="880" height="100" rx="6" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <text x="16" y="20" font-size="12" font-weight="bold" fill="#111827">Legend</text>

    <rect x="16" y="32" width="16" height="16" fill="#065f46"/>
    <text x="38" y="45" font-size="11" fill="#111827">writes its own artifacts</text>

    <rect x="230" y="32" width="16" height="16" fill="#3730a3"/>
    <text x="252" y="45" font-size="11" fill="#111827">gate — read-only code, owns .cfg</text>

    <rect x="500" y="32" width="16" height="16" fill="#7c2d12"/>
    <text x="522" y="45" font-size="11" fill="#111827">read-only, report-only</text>

    <rect x="720" y="32" width="16" height="16" fill="#334155"/>
    <text x="742" y="45" font-size="11" fill="#111827">endpoint</text>

    <line x1="16" y1="70" x2="46" y2="70" stroke="#111827" stroke-width="2" marker-end="url(#arrowBlack)"/>
    <text x="54" y="74" font-size="11" fill="#111827">pipeline flow</text>

    <line x1="230" y1="70" x2="260" y2="70" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
    <text x="268" y="74" font-size="11" fill="#111827">reject / fail loop</text>

    <line x1="500" y1="70" x2="530" y2="70" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowBlue)"/>
    <text x="538" y="74" font-size="11" fill="#111827">advisory loop (post-archive)</text>
  </g>
  </g>
</svg>
