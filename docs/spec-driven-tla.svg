<svg viewBox="0 0 1000 1330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111827"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1330" fill="#ffffff"/>
  <text x="500" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">spec-driven-tla — sub-agent pipeline</text>

  <g transform="translate(0,35)">
  <!-- main flow arrows -->
  <path d="M430,68 L430,100" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,170 L430,250" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,320 L430,355" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="450" y="342" font-size="11" fill="#111827">APPROVE — interfaces FROZEN</text>
  <path d="M430,435 L430,480" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,550 L430,585" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,665 L430,710" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,780 L430,860" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,930 L430,962" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="450" y="950" font-size="11" fill="#111827">green</text>
  <path d="M430,1018 L430,1050" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>

  <!-- design-gate <-> tla-checker -->
  <path d="M560,270 L650,270" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="565" y="263" font-size="10" fill="#111827">props to check</text>
  <path d="M650,300 L560,300" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="565" y="315" font-size="10" fill="#111827">PASS</text>

  <!-- feedback loop: tla-checker FAIL -> spec-author -->
  <path d="M760,250 L760,150 L560,150" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="610" y="142" font-size="10" fill="#b91c1c">FAIL: counterexample</text>

  <!-- feedback loop: design-gate REJECT -> spec-author -->
  <path d="M300,285 L190,285 L190,125 L300,125" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="185" y="205" text-anchor="end" font-size="10" fill="#b91c1c">REJECT: named property</text>

  <!-- Request -->
  <ellipse cx="430" cy="40" rx="110" ry="28" fill="#334155"/>
  <text x="430" y="45" text-anchor="middle" font-size="13" fill="#ffffff">feature request</text>

  <!-- spec-author -->
  <rect x="300" y="100" width="260" height="70" rx="8" fill="#065f46"/>
  <text x="430" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">spec-author</text>
  <text x="430" y="142" text-anchor="middle" font-size="11" fill="#d1fae5">proposal.md, design.md</text>
  <text x="430" y="156" text-anchor="middle" font-size="10" fill="#a7f3d0">specs/tla/&lt;id&gt;.tla</text>

  <!-- design-gate -->
  <rect x="300" y="250" width="260" height="70" rx="8" fill="#3730a3"/>
  <text x="430" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">design-gate</text>
  <text x="430" y="292" text-anchor="middle" font-size="11" fill="#e0e7ff">validate --strict, review</text>
  <text x="430" y="306" text-anchor="middle" font-size="10" fill="#c7d2fe">owns specs/tla/&lt;id&gt;.cfg</text>

  <!-- tla-checker -->
  <rect x="650" y="250" width="220" height="70" rx="8" fill="#7c2d12"/>
  <text x="760" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">tla-checker</text>
  <text x="760" y="292" text-anchor="middle" font-size="11" fill="#fed7aa">SANY + TLC</text>
  <text x="760" y="306" text-anchor="middle" font-size="10" fill="#fdba74">PASS / FAIL + trace</text>

  <!-- CHECKPOINT 1 -->
  <ellipse cx="430" cy="395" rx="170" ry="40" fill="#b45309"/>
  <text x="430" y="389" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">CHECKPOINT 1 — ask the user</text>
  <text x="430" y="404" text-anchor="middle" font-size="11" fill="#ffedd5">/design diagrams before implementation?</text>

  <!-- task-planner -->
  <rect x="300" y="480" width="260" height="70" rx="8" fill="#065f46"/>
  <text x="430" y="502" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">task-planner</text>
  <text x="430" y="517" text-anchor="middle" font-size="10" fill="#d1fae5">tasks.md, tags Files: / Depends on:</text>
  <text x="430" y="530" text-anchor="middle" font-size="10" fill="#a7f3d0">every task traces to spec</text>
  <text x="430" y="542" text-anchor="middle" font-size="10" fill="#a7f3d0">per group</text>

  <!-- CHECKPOINT 2 -->
  <ellipse cx="430" cy="625" rx="170" ry="40" fill="#b45309"/>
  <text x="430" y="619" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">CHECKPOINT 2 — ask the user</text>
  <text x="430" y="634" text-anchor="middle" font-size="11" fill="#ffedd5">continue to implementation?</text>

  <!-- implementer -->
  <rect x="300" y="710" width="260" height="70" rx="8" fill="#065f46"/>
  <text x="430" y="736" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">implementer</text>
  <text x="430" y="752" text-anchor="middle" font-size="11" fill="#d1fae5">code to frozen contracts</text>
  <text x="430" y="766" text-anchor="middle" font-size="10" fill="#a7f3d0">never edits design.md / .tla</text>

  <!-- verifier -->
  <rect x="300" y="860" width="260" height="70" rx="8" fill="#065f46"/>
  <text x="430" y="886" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">verifier</text>
  <text x="430" y="902" text-anchor="middle" font-size="11" fill="#d1fae5">tests from spec scenarios</text>
  <text x="430" y="916" text-anchor="middle" font-size="10" fill="#a7f3d0">green = matches spec</text>

  <!-- archive -->
  <ellipse cx="430" cy="990" rx="100" ry="28" fill="#334155"/>
  <text x="430" y="995" text-anchor="middle" font-size="13" fill="#ffffff">openspec archive</text>

  <!-- optimizer -->
  <rect x="300" y="1050" width="260" height="70" rx="8" fill="#7c2d12"/>
  <text x="430" y="1076" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">optimizer</text>
  <text x="430" y="1092" text-anchor="middle" font-size="11" fill="#fed7aa">advisory, post-archive</text>
  <text x="430" y="1106" text-anchor="middle" font-size="10" fill="#fdba74">read-only everywhere</text>

  <!-- feedback loop: verifier red -> implementer -->
  <path d="M300,895 L250,895 L250,745 L300,745" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="245" y="825" text-anchor="end" font-size="10" fill="#b91c1c">red</text>

  <!-- advisory loop: optimizer SAFE -> implementer -->
  <path d="M300,1085 L130,1085 L130,745 L300,745" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-dasharray="2,3" marker-end="url(#arrowBlue)"/>
  <text x="125" y="920" text-anchor="end" font-size="10" fill="#1d4ed8">SAFE: internals only</text>

  <!-- advisory loop: optimizer INTERFACE -> spec-author -->
  <path d="M300,1105 L70,1105 L70,150 L300,150" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-dasharray="2,3" marker-end="url(#arrowBlue)"/>
  <text x="65" y="640" text-anchor="end" font-size="10" fill="#1d4ed8">INTERFACE: new contract</text>

  <!-- legend -->
  <g transform="translate(60,1150)">
    <rect x="0" y="0" width="880" height="130" rx="6" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <text x="16" y="20" font-size="12" font-weight="bold" fill="#111827">Legend</text>

    <rect x="16" y="32" width="16" height="16" fill="#065f46"/>
    <text x="38" y="45" font-size="11" fill="#111827">writes its own artifacts</text>

    <rect x="230" y="32" width="16" height="16" fill="#3730a3"/>
    <text x="252" y="45" font-size="11" fill="#111827">gate — read-only code, owns .cfg</text>

    <rect x="500" y="32" width="16" height="16" fill="#7c2d12"/>
    <text x="522" y="45" font-size="11" fill="#111827">read-only, report-only</text>

    <rect x="720" y="32" width="16" height="16" fill="#334155"/>
    <text x="742" y="45" font-size="11" fill="#111827">endpoint</text>

    <rect x="16" y="60" width="16" height="16" fill="#b45309"/>
    <text x="38" y="73" font-size="11" fill="#111827">human checkpoint — orchestrator asks the user</text>

    <line x1="16" y1="98" x2="46" y2="98" stroke="#111827" stroke-width="2" marker-end="url(#arrowBlack)"/>
    <text x="54" y="102" font-size="11" fill="#111827">pipeline flow</text>

    <line x1="230" y1="98" x2="260" y2="98" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
    <text x="268" y="102" font-size="11" fill="#111827">reject / fail loop</text>

    <line x1="500" y1="98" x2="530" y2="98" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowBlue)"/>
    <text x="538" y="102" font-size="11" fill="#111827">advisory loop (post-archive)</text>
  </g>

  </g>
</svg>
