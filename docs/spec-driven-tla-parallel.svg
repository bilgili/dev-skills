<svg viewBox="0 0 1000 1470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111827"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1470" fill="#ffffff"/>
  <text x="500" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">spec-driven-tla-parallel — sub-agent pipeline</text>

  <g transform="translate(0,35)">

  <!-- main flow: request -> spec-author -> design-gate -> task-planner -->
  <path d="M430,68 L430,100" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,170 L430,250" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,320 L430,400" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="450" y="365" font-size="11" fill="#111827">APPROVE — interfaces FROZEN</text>

  <!-- task-planner -> orchestrator (Plan) -->
  <path d="M430,470 L430,550" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="450" y="515" font-size="11" fill="#111827">tasks.md: Files: / Depends on:</text>

  <!-- design-gate <-> tla-checker -->
  <path d="M560,270 L650,270" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="565" y="263" font-size="10" fill="#111827">props to check</text>
  <path d="M650,300 L560,300" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="565" y="315" font-size="10" fill="#111827">PASS</text>

  <!-- feedback loop: tla-checker FAIL -> spec-author -->
  <path d="M760,250 L760,150 L560,150" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="610" y="142" font-size="10" fill="#b91c1c">FAIL: counterexample</text>

  <!-- feedback loop: design-gate REJECT -> spec-author -->
  <path d="M300,285 L190,285 L190,125 L300,125" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="185" y="205" text-anchor="end" font-size="10" fill="#b91c1c">REJECT: named property</text>

  <!-- Request -->
  <ellipse cx="430" cy="40" rx="110" ry="28" fill="#334155"/>
  <text x="430" y="45" text-anchor="middle" font-size="13" fill="#ffffff">feature request</text>

  <!-- spec-author -->
  <rect x="300" y="100" width="260" height="70" rx="8" fill="#065f46"/>
  <text x="430" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">spec-author</text>
  <text x="430" y="142" text-anchor="middle" font-size="11" fill="#d1fae5">proposal.md, design.md</text>
  <text x="430" y="156" text-anchor="middle" font-size="10" fill="#a7f3d0">specs/tla/&lt;id&gt;.tla</text>

  <!-- design-gate -->
  <rect x="300" y="250" width="260" height="70" rx="8" fill="#3730a3"/>
  <text x="430" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">design-gate</text>
  <text x="430" y="292" text-anchor="middle" font-size="11" fill="#e0e7ff">validate --strict, review</text>
  <text x="430" y="306" text-anchor="middle" font-size="10" fill="#c7d2fe">owns specs/tla/&lt;id&gt;.cfg</text>

  <!-- tla-checker -->
  <rect x="650" y="250" width="220" height="70" rx="8" fill="#7c2d12"/>
  <text x="760" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">tla-checker</text>
  <text x="760" y="292" text-anchor="middle" font-size="11" fill="#fed7aa">SANY + TLC</text>
  <text x="760" y="306" text-anchor="middle" font-size="10" fill="#fdba74">PASS / FAIL + trace</text>

  <!-- task-planner -->
  <rect x="300" y="400" width="260" height="70" rx="8" fill="#065f46"/>
  <text x="430" y="422" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">task-planner</text>
  <text x="430" y="437" text-anchor="middle" font-size="10" fill="#d1fae5">tasks.md, tags Files: / Depends on:</text>
  <text x="430" y="450" text-anchor="middle" font-size="10" fill="#a7f3d0">every task traces to spec</text>
  <text x="430" y="462" text-anchor="middle" font-size="10" fill="#a7f3d0">per group</text>

  <!-- implementation-orchestrator: Plan -->
  <rect x="300" y="550" width="260" height="70" rx="8" fill="#5b21b6"/>
  <text x="430" y="572" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">implementation-orchestrator</text>
  <text x="430" y="587" text-anchor="middle" font-size="10" fill="#ede9fe">Plan: batch parallel-safe groups</text>
  <text x="430" y="600" text-anchor="middle" font-size="10" fill="#ddd6fe">1 git worktree per group — never writes source</text>

  <!-- Plan -> implementer group boxes -->
  <path d="M330,620 L250,700" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,620 L430,700" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M530,620 L610,700" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="430" y="655" text-anchor="middle" font-size="10" fill="#111827">main session dispatches — one message, concurrent</text>

  <!-- implementer group A/B/C -->
  <rect x="175" y="700" width="150" height="70" rx="8" fill="#065f46"/>
  <text x="250" y="724" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">implementer</text>
  <text x="250" y="739" text-anchor="middle" font-size="10" fill="#d1fae5">group A</text>
  <text x="250" y="752" text-anchor="middle" font-size="9" fill="#a7f3d0">own worktree</text>

  <rect x="355" y="700" width="150" height="70" rx="8" fill="#065f46"/>
  <text x="430" y="724" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">implementer</text>
  <text x="430" y="739" text-anchor="middle" font-size="10" fill="#d1fae5">group B</text>
  <text x="430" y="752" text-anchor="middle" font-size="9" fill="#a7f3d0">own worktree</text>

  <rect x="535" y="700" width="150" height="70" rx="8" fill="#065f46"/>
  <text x="610" y="724" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">implementer</text>
  <text x="610" y="739" text-anchor="middle" font-size="10" fill="#d1fae5">group C</text>
  <text x="610" y="752" text-anchor="middle" font-size="9" fill="#a7f3d0">own worktree</text>

  <text x="720" y="740" font-size="10" fill="#111827">… one per parallel-safe group</text>

  <!-- implementer group boxes -> Integrate -->
  <path d="M250,770 L330,850" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M430,770 L430,850" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <path d="M610,770 L530,850" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="430" y="805" text-anchor="middle" font-size="10" fill="#111827">DONE, or STOP: interface / scope friction</text>

  <!-- implementation-orchestrator: Integrate -->
  <rect x="300" y="850" width="260" height="70" rx="8" fill="#5b21b6"/>
  <text x="430" y="872" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">implementation-orchestrator</text>
  <text x="430" y="887" text-anchor="middle" font-size="10" fill="#ede9fe">Integrate: merge worktrees</text>
  <text x="430" y="900" text-anchor="middle" font-size="10" fill="#ddd6fe">checks off tasks.md, removes worktrees</text>

  <!-- loop: groups remain -> back to Plan -->
  <path d="M300,885 L90,885 L90,585 L300,585" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-dasharray="2,3" marker-end="url(#arrowBlue)"/>
  <text x="85" y="740" text-anchor="end" font-size="10" fill="#1d4ed8">groups remain: next batch</text>

  <!-- escalation: scope/interface friction -> stop -> task-planner re-scope -->
  <ellipse cx="800" cy="885" rx="120" ry="30" fill="#334155"/>
  <text x="800" y="880" text-anchor="middle" font-size="11" fill="#ffffff">stop: scope / interface</text>
  <text x="800" y="894" text-anchor="middle" font-size="11" fill="#ffffff">friction</text>
  <path d="M560,885 L680,885" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <path d="M900,885 L940,885 L940,435 L560,435" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="935" y="660" text-anchor="end" font-size="10" fill="#b91c1c">re-scope groups</text>

  <!-- Integrate -> verifier (all groups checked) -->
  <path d="M430,920 L430,1000" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="450" y="965" font-size="11" fill="#111827">every group checked</text>

  <!-- verifier -->
  <rect x="300" y="1000" width="260" height="70" rx="8" fill="#065f46"/>
  <text x="430" y="1026" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">verifier</text>
  <text x="430" y="1042" text-anchor="middle" font-size="11" fill="#d1fae5">tests from spec scenarios</text>
  <text x="430" y="1056" text-anchor="middle" font-size="10" fill="#a7f3d0">green = matches spec</text>

  <path d="M430,1070 L430,1102" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="450" y="1095" font-size="11" fill="#111827">green</text>

  <!-- archive -->
  <ellipse cx="430" cy="1130" rx="100" ry="28" fill="#334155"/>
  <text x="430" y="1135" text-anchor="middle" font-size="13" fill="#ffffff">openspec archive</text>

  <path d="M430,1158 L430,1200" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>

  <!-- optimizer -->
  <rect x="300" y="1200" width="260" height="70" rx="8" fill="#7c2d12"/>
  <text x="430" y="1226" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">optimizer</text>
  <text x="430" y="1242" text-anchor="middle" font-size="11" fill="#fed7aa">advisory, post-archive</text>
  <text x="430" y="1256" text-anchor="middle" font-size="10" fill="#fdba74">read-only everywhere</text>

  <!-- optimizer loops back (SAFE -> implementer group, INTERFACE -> spec-author) -->
  <path d="M300,1235 L60,1235 L60,735 L175,735" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-dasharray="2,3" marker-end="url(#arrowBlue)"/>
  <text x="55" y="990" text-anchor="end" font-size="10" fill="#1d4ed8">SAFE: internals only (next batch's implementer)</text>

  <path d="M300,1255 L30,1255 L30,150 L300,150" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-dasharray="2,3" marker-end="url(#arrowBlue)"/>
  <text x="25" y="700" text-anchor="end" font-size="10" fill="#1d4ed8">INTERFACE: new contract</text>

  <!-- legend -->
  <g transform="translate(60,1320)">
    <rect x="0" y="0" width="880" height="110" rx="6" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <text x="16" y="20" font-size="12" font-weight="bold" fill="#111827">Legend</text>

    <rect x="16" y="32" width="16" height="16" fill="#065f46"/>
    <text x="38" y="45" font-size="11" fill="#111827">writes its own artifacts / source</text>

    <rect x="270" y="32" width="16" height="16" fill="#3730a3"/>
    <text x="292" y="45" font-size="11" fill="#111827">gate — read-only code, owns .cfg</text>

    <rect x="540" y="32" width="16" height="16" fill="#5b21b6"/>
    <text x="562" y="45" font-size="11" fill="#111827">orchestrator — plans/merges, never writes source</text>

    <rect x="16" y="60" width="16" height="16" fill="#7c2d12"/>
    <text x="38" y="73" font-size="11" fill="#111827">read-only, report-only</text>

    <rect x="270" y="60" width="16" height="16" fill="#334155"/>
    <text x="292" y="73" font-size="11" fill="#111827">endpoint</text>

    <line x1="16" y1="90" x2="46" y2="90" stroke="#111827" stroke-width="2" marker-end="url(#arrowBlack)"/>
    <text x="54" y="94" font-size="11" fill="#111827">pipeline flow</text>

    <line x1="230" y1="90" x2="260" y2="90" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
    <text x="268" y="94" font-size="11" fill="#111827">reject / fail / friction loop</text>

    <line x1="530" y1="90" x2="560" y2="90" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowBlue)"/>
    <text x="568" y="94" font-size="11" fill="#111827">batch loop / advisory loop</text>
  </g>

  </g>
</svg>
