\* Proposed design: settled-question rule + log the ESCALATE entry after the user answers.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  MaxQ = 2
  MaxCalls = 4
  MaxCrash = 1
  MaxOrchCalls = 1
  ReaskSettled = FALSE
  LogEscalatedBeforeUser = FALSE
INVARIANTS
  TypeOK
  NoFinalWhileEscalated
  NoDoubleLog
  LogComplete
  NoPendingEntry
  NoRepeatUserQuestion
  NoAgentAfterStop
  NoUnloggedAtEnd
PROPERTIES
  LogWrittenOnlyByOrch
  LogBeforeAct
  FrozenAfterStop
  Terminates
  EscalationResolves
CHECK_DEADLOCK FALSE
